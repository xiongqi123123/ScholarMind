# 领域和方向的起步词表（草稿，供修改）
# - 领域是固定的 5 个，外加"范围外"。
# - 方向是领域下面的研究方向，粒度是"有一批人专门在做、能叫得出名字的方向"，
#   比具体方法名粗（具体方法名进关键词），比领域细。
# - name 是规范名（英文，界面上也显示它），zh 是中文说明，aliases 是会被认作同一个方向的其他写法。
# - 模型给论文打方向时先在这里选；都不合适才新建，新建的方向会自动加进词表。

computer-vision:
  zh: 计算机视觉
  topics:
    - {name: 3D Gaussian Splatting, zh: 三维高斯泼溅, aliases: [3DGS, Gaussian Splatting]}
    - {name: Neural Radiance Fields, zh: 神经辐射场与神经渲染, aliases: [NeRF, neural rendering, novel view synthesis]}
    - {name: 3D Reconstruction, zh: 三维重建（多视图、SfM、MVS）, aliases: [multi-view stereo, structure from motion]}
    - {name: Stereo Matching, zh: 双目立体匹配, aliases: [stereo depth]}
    - {name: Monocular Depth Estimation, zh: 单目深度估计, aliases: [metric depth]}
    - {name: Optical Flow, zh: 光流与场景流, aliases: [scene flow]}
    - {name: Visual SLAM, zh: 视觉 SLAM 与里程计, aliases: [visual odometry, SLAM]}
    - {name: Object Detection, zh: 目标检测, aliases: [open-vocabulary detection]}
    - {name: Segmentation, zh: 分割（语义、实例、全景）, aliases: [semantic segmentation, instance segmentation]}
    - {name: Tracking, zh: 目标跟踪与点跟踪, aliases: [multi-object tracking, point tracking]}
    - {name: Pose Estimation, zh: 人体与物体位姿估计, aliases: [6D pose, human pose]}
    - {name: Point Cloud Understanding, zh: 点云理解, aliases: [3D perception, LiDAR perception]}
    - {name: Image Generation, zh: 图像生成（扩散、自回归）, aliases: [text-to-image, diffusion models]}
    - {name: Video Generation, zh: 视频生成, aliases: [text-to-video]}
    - {name: 3D Generation, zh: 三维内容生成, aliases: [text-to-3D, 4D generation]}
    - {name: Image and Video Editing, zh: 图像与视频编辑, aliases: [image editing]}
    - {name: Image Restoration, zh: 图像复原与增强（去噪、超分、去模糊）, aliases: [super-resolution, low-level vision]}
    - {name: Video Understanding, zh: 视频理解（动作识别、时序定位）, aliases: [action recognition]}
    - {name: Vision-Language Models, zh: 视觉语言模型, aliases: [VLM, multimodal LLM]}
    - {name: Visual Representation Learning, zh: 视觉表征学习与视觉基础模型, aliases: [self-supervised learning, vision foundation model]}
    - {name: Medical Imaging, zh: 医学影像, aliases: []}

