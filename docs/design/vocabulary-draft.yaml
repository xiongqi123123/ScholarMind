    - {name: LLM Reasoning, zh: 大模型的推理与思维链, aliases: [chain-of-thought, reasoning]}
    - {name: Retrieval-Augmented Generation, zh: 检索增强生成, aliases: [RAG]}
    - {name: LLM Agents, zh: 大模型智能体与工具使用, aliases: [agents, tool use, multi-agent]}
    - {name: LLM Fine-tuning, zh: 微调与适配（LoRA、指令微调）, aliases: [PEFT, instruction tuning]}
    - {name: Efficient LLM, zh: 大模型的压缩与加速, aliases: [quantization, distillation, efficient inference]}
    - {name: LLM Evaluation, zh: 大模型评测与基准, aliases: [benchmark]}
    - {name: LLM Safety and Alignment, zh: 安全、对齐与幻觉, aliases: [hallucination, jailbreak, alignment]}
    - {name: Interpretability, zh: 可解释性与机理分析, aliases: [mechanistic interpretability]}
    - {name: Code Generation, zh: 代码生成, aliases: [code LLM]}
    - {name: Machine Translation, zh: 机器翻译与多语言, aliases: [multilingual]}
    - {name: Information Extraction, zh: 信息抽取与知识图谱, aliases: [knowledge graph]}
    - {name: Dialogue Systems, zh: 对话系统, aliases: []}
    - {name: Speech and Audio, zh: 语音与音频, aliases: [ASR, TTS]}

