[build-system]
requires = ["setuptools>=77"]  # 77: license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "scholarmind"
version = "0.2.0"
description = "Self-hosted paper library with AI-generated tags and reports"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.13",
    "cryptography>=42",  # the model API key set on the web is stored encrypted (agent.py)
    "fastapi>=0.115",
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pillow>=11",
    "pypdfium2>=4.30",
    "pyyaml>=6",
    "rq>=3.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
scholarmind = "scholarmind.cli:main"

[tool.setuptools]
packages = ["scholarmind"]

[tool.setuptools.package-data]
scholarmind = ["vocabulary.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
